[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-dataset-studio"
version = "2.5.2"
description = "Offline satellite pose dataset service"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.scripts]
satellite-studio = "satellite_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
